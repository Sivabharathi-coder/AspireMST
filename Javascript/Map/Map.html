<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
</head>

<body>
  <h2>Cart Items</h2>
  <div id="cart"></div>
  <h3 id="total"></h3>

  <script>
    const cart = [
      { name: "Shoes", price: 1200, qty: 2 },
      { name: "T-Shirt", price: 800, qty: 1 },
      { name: "Jeans", price: 2000, qty: 1 },
      { name: "Cap", price: 300, qty: 3 }
    ];

    const itemsWithTotal = cart.map(item => ({
      ...item,
      totalPrice: item.price * item.qty
    }));

    const expensiveItems = itemsWithTotal.filter(item => item.totalPrice > 1000);

    const cartTotal = itemsWithTotal.reduce((acc, item) => acc + item.totalPrice, 0);

    const cartDiv = document.getElementById("cart");

    itemsWithTotal.forEach(item => {
      const div = document.createElement("div");
      div.innerHTML = `<strong>${item.name}</strong> - ₹${item.price} x ${item.qty} = ₹${item.totalPrice}`;
      cartDiv.appendChild(div);
    });

    document.getElementById("total").innerText = "Total Cart Amount: ₹" + cartTotal;
  </script>
</body>

</html>
