<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salary Calculator</title>
</head>

<body>

  <label for="base">Monthly Base Salary:</label>
  <input type="number" id="base" value="30000" /> <br /><br />

  <label for="bonus">Monthly Bonus:</label>
  <input type="number" id="bonus" value="5000" /> <br /><br />

  <button onclick="calculateSalary()">Calculate Total Annual Salary</button>

  <p id="result"></p>

  <script>
    function add(monthlyBase, monthlyBonus) {
      return monthlyBase + monthlyBonus;
    }

    function calculateSalary() {
      const base = parseInt(document.getElementById("base").value);
      const bonus = parseInt(document.getElementById("bonus").value);

      const totalMonthly = add(base, bonus);
      const annual = totalMonthly * 12;

      document.getElementById("result").innerText =
        ` Estimated Annual Package: ₹${annual}`;
    }
  </script>
</body>

</html>
