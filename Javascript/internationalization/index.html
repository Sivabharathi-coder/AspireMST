<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intl Real-Time Example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 5px #ccc; }
    .title { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Total Amount</div>
    <div id="currency"></div>
  </div>

  <div class="card">
    <div class="title"> Order Date</div>
    <div id="date"></div>
  </div>

  <div class="card">
    <div class="title">Customer Names (Sorted - Tamil)</div>
    <ul id="names"></ul>
  </div>

  <div class="card">
    <div class="title"> Cart Items</div>
    <ul id="cartItems"></ul>
  </div>

  <script src="script.js">
  
  </script>

</body>
</html>
