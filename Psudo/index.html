<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Job Applications</h1>

    <div class="dashboard">
        <div class="job-card urgent">
            <h2>Frontend Developer</h2>
            <p>Company: TechNova</p>
            <p>Status: Interview Scheduled</p>
            <button class="delete-btn">Remove</button>
        </div>

        <div class="job-card remote">
            <h2>Backend Developer</h2>
            <p>Company: CodeSphere</p>
            <p>Status: Applied</p>
        </div>

        <div class="job-card">
            <h2>UI/UX Designer</h2>
            <p>Company: PixelNest</p>
            <p>Status: Rejected</p>
        </div>

        <div class="job-card active">
            <h2>React Developer</h2>
            <p>Company: FrontCraft</p>
            <p>Status: Offer Received</p>
            <input type="text" placeholder="Reply..." />
        </div>

        <div class="job-card"></div> 
    </div>
</body>

</html>
